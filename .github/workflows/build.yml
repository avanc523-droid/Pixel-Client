name: Build Pixel Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pixel_Client_1.21.11_Rainbow_Pixel_Source
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and remap Pixel Client
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload installable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Client-Fabric-1.21.11
          path: Pixel_Client_1.21.11_Rainbow_Pixel_Source/build/libs/pixelclient-1.0.0.jar
          if-no-files-found: error
